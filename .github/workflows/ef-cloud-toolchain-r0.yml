name: EtherForge Cloud Toolchain R0

on:
  push:
    branches: [ef-cloud-toolchain-r0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Acquire Godot 4.7.2 stable
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .ef_tools/godot
          cd .ef_tools/godot
          curl -L --fail --retry 3 -o Godot_v4.7.2-stable_linux.x86_64.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  Godot_v4.7.2-stable_linux.x86_64.zip' | sha256sum -c -
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --version | tee godot_version.txt

      - name: Acquire Blender 5.2.1 LTS
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .ef_tools/blender
          cd .ef_tools/blender
          curl -L --fail --retry 3 -o blender-5.2.1-linux-x64.tar.xz \
            https://download.blender.org/release/Blender5.2/blender-5.2.1-linux-x64.tar.xz
          curl -L --fail --retry 3 -o blender-5.2.1.sha256 \
            https://download.blender.org/release/Blender5.2/blender-5.2.1.sha256
          grep 'blender-5.2.1-linux-x64.tar.xz' blender-5.2.1.sha256 | sha256sum -c -
          tar -xf blender-5.2.1-linux-x64.tar.xz
          ./.ef_missing 2>/dev/null || true
          ./blender-5.2.1-linux-x64/blender --background --version | tee blender_version.txt

      - name: Author measured 2x4 in Blender and export GLB
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p smoke
          cat > smoke/author_2x4.py <<'PY'
          import bpy
          from pathlib import Path

          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)

          # Actual dressed 2x4 x 8 ft: 1.5 in x 3.5 in x 96 in.
          dims = (0.0381, 2.4384, 0.0889)
          bpy.ops.mesh.primitive_cube_add(size=1.0, location=(0, dims[1] / 2.0, 0))
          obj = bpy.context.active_object
          obj.name = 'DS_LUMBER_2X4X8_A_RENDER'
          obj.dimensions = dims
          bpy.ops.object.transform_apply(location=False, rotation=False, scale=True)

          bevel = obj.modifiers.new('ManufacturedEdgeBevel', 'BEVEL')
          bevel.width = 0.0015
          bevel.segments = 2
          bpy.context.view_layer.objects.active = obj
          bpy.ops.object.modifier_apply(modifier=bevel.name)

          obj['ef_asset_id'] = 'DS_LUMBER_2X4X8_A'
          obj['ef_nominal'] = '2x4x8'
          obj['ef_actual_inches'] = '1.5x3.5x96'
          obj['ef_units'] = 'meter'
          obj['ef_status'] = 'GEOMETRY_SMOKE_ONLY_NOT_ART_GREEN'

          out = Path.cwd() / 'smoke' / 'DS_LUMBER_2X4X8_A.glb'
          bpy.ops.export_scene.gltf(filepath=str(out), export_format='GLB', use_selection=False)
          print(f'EF_GLTF_EXPORTED={out}')
          PY
          .ef_tools/blender/blender-5.2.1-linux-x64/blender --background --factory-startup --python smoke/author_2x4.py | tee smoke/blender_author.log
          test -s smoke/DS_LUMBER_2X4X8_A.glb

      - name: Godot import and boot smoke
        shell: bash
        run: |
          set -euxo pipefail
          cp smoke/DS_LUMBER_2X4X8_A.glb smoke/EF_2X4X8_ART.glb
          cat > smoke/project.godot <<'EOF'
          [application]
          config/name="EF Cloud Toolchain Smoke"
          run/main_scene="res://main.tscn"
          [display]
          window/size/viewport_width=640
          window/size/viewport_height=360
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF
          cat > smoke/main.tscn <<'EOF'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="PackedScene" path="res://EF_2X4X8_ART.glb" id="1"]

          [node name="Main" type="Node3D"]

          [node name="Board" parent="." instance=ExtResource("1")]
          EOF
          .ef_tools/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path smoke --quit | tee smoke/godot_import.log
          .ef_tools/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path smoke --quit-after 3 | tee smoke/godot_boot.log

      - name: Build receipt
        shell: bash
        run: |
          set -euxo pipefail
          GODOT_SHA=$(sha256sum .ef_tools/godot/Godot_v4.7.2-stable_linux.x86_64.zip | awk '{print $1}')
          BLENDER_SHA=$(sha256sum .ef_tools/blender/blender-5.2.1-linux-x64.tar.xz | awk '{print $1}')
          GLB_SHA=$(sha256sum smoke/DS_LUMBER_2X4X8_A.glb | awk '{print $1}')
          {
            echo 'ETHERFORGE CLOUD TOOLCHAIN R0'
            echo "godot_sha256=$GODOT_SHA"
            echo "blender_sha256=$BLENDER_SHA"
            echo "glb_sha256=$GLB_SHA"
            echo 'godot=4.7.2-stable'
            echo 'blender=5.2.1-LTS'
            echo '2x4_actual_m=0.0381 x 0.0889 x 2.4384'
            echo 'status=TOOLCHAIN_SMOKE_CANDIDATE_NOT_GAME_GREEN'
          } | tee smoke/TOOLCHAIN_RECEIPT.txt

      - name: Upload compact proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: ef-toolchain-proof-r0
          path: |
            smoke/DS_LUMBER_2X4X8_A.glb
            smoke/TOOLCHAIN_RECEIPT.txt
            smoke/blender_author.log
            smoke/godot_import.log
            smoke/godot_boot.log
            .ef_tools/godot/godot_version.txt
            .ef_tools/blender/blender_version.txt
          retention-days: 7

      - name: Upload portable toolchain archives
        uses: actions/upload-artifact@v4
        with:
          name: ef-linux-toolchain-cache-r0
          compression-level: 0
          path: |
            .ef_tools/godot/Godot_v4.7.2-stable_linux.x86_64.zip
            .ef_tools/blender/blender-5.2.1-linux-x64.tar.xz
          retention-days: 7
